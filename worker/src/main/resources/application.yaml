server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apurador}
    username: ${DB_USER:apurador}
    password: ${DB_PASSWORD:apurador}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 1
        max-concurrency: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

apurador:
  worker:
    id: ${WORKER_ID:worker-local}
    atraso-ms: ${WORKER_ATRASO_MS:0}
  dispatcher:
    url: ${DISPATCHER_URL:http://localhost:8080}
  heartbeat:
    intervalo-ms: ${HEARTBEAT_INTERVALO_MS:1000}
    espera-ms: 800
  fila:
    limite-de-entregas: ${FILA_LIMITE_ENTREGAS:5}
