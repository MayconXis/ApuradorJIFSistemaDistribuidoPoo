# Gateway e Dispatcher. Uma réplica só, porque o anel fica em memória.
# Recreate: na troca de versão, o pod antigo sai antes de o novo entrar,
# para nunca existirem dois anéis ao mesmo tempo.
apiVersion: v1
kind: Service
metadata:
  name: dispatcher
  namespace: apurador
spec:
  selector:
    app: dispatcher
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: apurador
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dispatcher
  template:
    metadata:
      labels:
        app: dispatcher
    spec:
      containers:
        - name: dispatcher
          image: apurador/dispatcher:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: apurador-config }
            - secretRef: { name: apurador-segredos }
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
