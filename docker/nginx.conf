# A interface e a API saem do mesmo endereço. Assim o navegador não precisa de CORS
# e o Angular fala só com o Gateway, pelo caminho /api.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # "dispatcher" é o nome do serviço no docker compose e no k3s.
        proxy_pass http://dispatcher:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # O endereço /interno/heartbeats fica de fora de propósito: só os workers o usam.
    location /interno/ {
        return 404;
    }

    # Rotas do Angular (/registrar, /classificacao, /cluster) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
